<path d="M 626 90 L 706 90" stroke="#000000" stroke-width="1.5" fill="none"  marker-end="url(#seq-end)"/>
<path d="M 806 90 L 886 90" stroke="#000000" stroke-width="1.5" fill="none"  marker-end="url(#seq-end)"/>
<path d="M 986 90 L 1066 90" stroke="#000000" stroke-width="1.5" fill="none"  marker-end="url(#seq-end)"/>
